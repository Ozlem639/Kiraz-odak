<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiraz Odak &amp; Görevler</title>
    <style>
        :root {
            --bg-color: #fff1f2;
            --card-color: #ffffff;
            --cherry-red: #e11d48;
            --cherry-dark: #9f1239;
            --cherry-soft: #ffe4e6;
            --leaf-green: #16a34a;
            --leaf-soft: #dcfce7;
            --text-main: #4c0519;
            --text-muted: #9f123999;
            --border-color: #fecdd3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(#fecdd3 1px, transparent 1px);
            background-size: 20px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .header-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--cherry-dark);
            letter-spacing: -0.5px;
        }

        .card {
            background-color: var(--card-color);
            border-radius: 22px;
            padding: 20px;
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 25px rgba(225, 29, 72, 0.08);
        }

        h2 {
            font-size: 1.1rem;
            margin-bottom: 14px;
            color: var(--cherry-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
            background-color: var(--cherry-soft);
            padding: 12px;
            border-radius: 14px;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-item label {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--cherry-dark);
        }

        .setting-item input {
            width: 100%;
            padding: 8px 10px;
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-weight: 700;
            font-size: 0.95rem;
            text-align: center;
            outline: none;
        }

        .setting-item input:focus {
            border-color: var(--cherry-red);
        }

        .timer-display {
            font-size: 3.8rem;
            font-weight: 800;
            text-align: center;
            margin: 10px 0 18px 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            color: var(--cherry-red);
            transition: color 0.3s;
        }

        .timer-controls {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        .btn-cherry {
            background-color: var(--cherry-red);
            color: #ffffff;
            flex: 1.3;
        }

        .btn-soft {
            background-color: var(--cherry-soft);
            color: var(--cherry-dark);
            flex: 1;
        }

        .btn-delete {
            background-color: var(--cherry-soft);
            color: var(--cherry-red);
            padding: 6px 11px;
            font-size: 0.8rem;
            border-radius: 10px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
        }

        input[type="text"] {
            flex: 1;
            background-color: var(--bg-color);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 14px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="text"]:focus {
            border-color: var(--cherry-red);
            background-color: #ffffff;
        }

        ul {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        li {
            background-color: var(--bg-color);
            padding: 12px 14px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1.5px solid var(--border-color);
            transition: all 0.2s;
        }

        li.completed {
            opacity: 0.65;
            background-color: #fafafa;
        }

        li.completed .task-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .task-text {
            flex: 1;
            cursor: pointer;
            padding-right: 10px;
            word-break: break-word;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge {
            background-color: var(--cherry-soft);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 20px;
            color: var(--cherry-dark);
            white-space: nowrap;
        }

        .badge.break-mode {
            background-color: var(--leaf-soft);
            color: var(--leaf-green);
        }

        /* TAM EKRAN ODAK MODU */
        .fullscreen-overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at top, #ffe4e6 0%, #fff1f2 55%, #fecdd3 100%);
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 24px;
            text-align: center;
            transition: background 0.4s;
        }

        .fullscreen-overlay.active {
            display: flex;
        }

        .fullscreen-overlay.break-bg {
            background: radial-gradient(circle at top, #dcfce7 0%, #f0fdf4 60%, #bbf7d0 100%);
        }

        .fs-top {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .fs-status {
            font-size: 1rem;
            font-weight: 800;
            padding: 8px 18px;
            border-radius: 999px;
            background-color: rgba(255, 255, 255, 0.75);
            color: var(--cherry-dark);
            border: 1.5px solid var(--border-color);
        }

        .fullscreen-overlay.break-bg .fs-status {
            color: var(--leaf-green);
            border-color: #bbf7d0;
        }

        .fs-rain-note {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .fs-timer {
            font-size: clamp(4.8rem, 22vw, 8.5rem);
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
            color: var(--cherry-red);
            line-height: 1;
        }

        .fullscreen-overlay.break-bg .fs-timer {
            color: var(--leaf-green);
        }

        .fs-controls {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .fs-row {
            display: flex;
            gap: 10px;
        }

        .fs-btn {
            background-color: rgba(255, 255, 255, 0.85);
            color: var(--cherry-dark);
            border: 1.5px solid var(--border-color);
            flex: 1;
            padding: 14px;
            font-size: 0.95rem;
        }

        .fs-btn-primary {
            background-color: var(--cherry-red);
            color: #ffffff;
            border: none;
            flex: 1.2;
        }

        .fullscreen-overlay.break-bg .fs-btn-primary {
            background-color: var(--leaf-green);
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header-title">&#127826; Kiraz Odak</div>

    <div class="card">
        <h2>Zamanlayıcı <span class="badge" id="modeBadge">&#127826; Çalışma Zamanı</span></h2>

        <div class="settings-grid">
            <div class="setting-item">
                <label for="workMinutes">Çalışma (Dk)</label>
                <input type="number" id="workMinutes" min="1" max="180" value="25" onchange="updateSettings()">
            </div>
            <div class="setting-item">
                <label for="breakMinutes">Mola (Dk)</label>
                <input type="number" id="breakMinutes" min="1" max="60" value="5" onchange="updateSettings()">
            </div>
        </div>

        <div class="timer-display" id="timer">25:00</div>

        <div class="timer-controls">
            <button class="btn-cherry" id="startBtn" onclick="toggleTimer()">Başlat</button>
            <button class="btn-soft" onclick="resetTimer()">Sıfırla</button>
            <button class="btn-soft" onclick="switchMode()">Mod Değiş</button>
        </div>
    </div>

    <div class="card">
        <h2>Bugün ne yapmak istiyorsun ? <span class="badge" id="taskCount">0 Kalan</span></h2>
        <div class="input-group">
            <input type="text" id="taskInput" placeholder="Görevini buraya yaz... &#127826;" onkeypress="handleKeyPress(event)">
            <button class="btn-cherry" style="flex: 0.4;" onclick="addTask()">Ekle</button>
        </div>
        <ul id="taskList"></ul>
    </div>
</div>

<!-- TAM EKRAN SAYAÇ VE YAĞMUR SESİ EKRANI -->
<div class="fullscreen-overlay" id="fullscreenOverlay">
    <div class="fs-top">
        <div class="fs-status" id="fsModeBadge">&#127826; Çalışma Zamanı</div>
        <div class="fs-rain-note" id="rainStatusText">&#127783; Ferahlatıcı yağmur sesi açık</div>
    </div>

    <div class="fs-timer" id="fsTimer">25:00</div>

    <div class="fs-controls">
        <div class="fs-row">
            <button class="fs-btn fs-btn-primary" id="fsStartBtn" onclick="toggleTimer()">Duraklat</button>
            <button class="fs-btn" id="rainToggleBtn" onclick="toggleRainSound()">Yağmur: Açık</button>
        </div>
        <div class="fs-row">
            <button class="fs-btn" onclick="resetTimer()">Sıfırla</button>
            <button class="fs-btn" onclick="closeFullscreen()">Küçült</button>
        </div>
    </div>
</div>

<script>
    // --- FERAHLATICI YAĞMUR SESİ MOTORU (WEB AUDIO API) ---
    let audioCtx = null;
    let rainNode = null;
    let rainGain = null;
    let isRainEnabled = true;

    function startRainSound() {
        if (!isRainEnabled) return;
        try {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContextClass();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            if (rainNode) return;

            const bufferSize = 2 * audioCtx.sampleRate;
            const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            // Yumuşak pembe/kahverengi karışımı doğal yağmur dokusu
            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
            for (let i = 0; i < bufferSize; i++) {
                const white = Math.random() * 2 - 1;
                b0 = 0.99886 * b0 + white * 0.0555179;
                b1 = 0.99332 * b1 + white * 0.0750759;
                b2 = 0.96900 * b2 + white * 0.1538520;
                b3 = 0.86650 * b3 + white * 0.3104856;
                b4 = 0.55000 * b4 + white * 0.5329522;
                b5 = -0.7616 * b5 - white * 0.0168980;
                output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.035;
                b6 = white * 0.115926;
            }

            rainNode = audioCtx.createBufferSource();
            rainNode.buffer = noiseBuffer;
            rainNode.loop = true;

            // Tiz sertliği yumuşatan alçak geçiren filtre
            const lowpass = audioCtx.createBiquadFilter();
            lowpass.type = 'lowpass';
            lowpass.frequency.value = 950;

            rainGain = audioCtx.createGain();
            rainGain.gain.value = 0.45;

            rainNode.connect(lowpass);
            lowpass.connect(rainGain);
            rainGain.connect(audioCtx.destination);
            rainNode.start(0);
        } catch (e) {
            console.log('Ses başlatılamadı:', e);
        }
    }

    function stopRainSound() {
        if (rainNode) {
            try {
                rainNode.stop();
                rainNode.disconnect();
            } catch (e) {}
            rainNode = null;
        }
    }

    function toggleRainSound() {
        isRainEnabled = !isRainEnabled;
        const rainToggleBtn = document.getElementById('rainToggleBtn');
        const rainStatusText = document.getElementById('rainStatusText');

        if (isRainEnabled) {
            rainToggleBtn.textContent = 'Yağmur: Açık';
            rainStatusText.innerHTML = '&#127783; Ferahlatıcı yağmur sesi açık';
            if (timerId !== null) startRainSound();
        } else {
            rainToggleBtn.textContent = 'Yağmur: Kapalı';
            rainStatusText.textContent = 'Yağmur sesi kapalı';
            stopRainSound();
        }
    }

    // --- ZAMANLAYICI AYARLARI ---
    let workMins = parseInt(localStorage.getItem('cherry_work'), 10) || 25;
    let breakMins = parseInt(localStorage.getItem('cherry_break'), 10) || 5;

    const workInput = document.getElementById('workMinutes');
    const breakInput = document.getElementById('breakMinutes');
    workInput.value = workMins;
    breakInput.value = breakMins;

    let timeLeft = workMins * 60;
    let timerId = null;
    let isWorkMode = true;

    const timerDisplay = document.getElementById('timer');
    const fsTimerDisplay = document.getElementById('fsTimer');
    const startBtn = document.getElementById('startBtn');
    const fsStartBtn = document.getElementById('fsStartBtn');
    const modeBadge = document.getElementById('modeBadge');
    const fsModeBadge = document.getElementById('fsModeBadge');
    const fullscreenOverlay = document.getElementById('fullscreenOverlay');

    function openFullscreen() {
        fullscreenOverlay.classList.add('active');
    }

    function closeFullscreen() {
        fullscreenOverlay.classList.remove('active');
    }

    function updateSettings() {
        let w = parseInt(workInput.value, 10);
        let b = parseInt(breakInput.value, 10);

        if (isNaN(w) || w < 1) w = 1;
        if (isNaN(b) || b < 1) b = 1;

        workMins = w;
        breakMins = b;
        workInput.value = w;
        breakInput.value = b;

        localStorage.setItem('cherry_work', String(workMins));
        localStorage.setItem('cherry_break', String(breakMins));

        if (timerId === null) {
            timeLeft = (isWorkMode ? workMins : breakMins) * 60;
            updateTimerDisplay();
        }
    }

    function updateTimerDisplay() {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        const formatted = minutes.toString().padStart(2, '0') + ':' + seconds.toString().padStart(2, '0');
        timerDisplay.textContent = formatted;
        fsTimerDisplay.textContent = formatted;
    }

    function toggleTimer() {
        if (timerId !== null) {
            clearInterval(timerId);
            timerId = null;
            startBtn.textContent = 'Devam Et';
            fsStartBtn.textContent = 'Devam Et';
            stopRainSound();
        } else {
            startBtn.textContent = 'Duraklat';
            fsStartBtn.textContent = 'Duraklat';
            openFullscreen();
            startRainSound();

            timerId = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerId);
                    timerId = null;
                    stopRainSound();
                    closeFullscreen();
                    alert(isWorkMode
                        ? 'Harika iş! Çalışma süresi bitti, mola zamanı.'
                        : 'Mola bitti! Yeniden odaklanalım.');
                    switchMode();
                }
            }, 1000);
        }
    }

    function resetTimer() {
        clearInterval(timerId);
        timerId = null;
        stopRainSound();
        closeFullscreen();
        timeLeft = (isWorkMode ? workMins : breakMins) * 60;
        startBtn.textContent = 'Başlat';
        fsStartBtn.textContent = 'Başlat';
        updateTimerDisplay();
    }

    function switchMode() {
        isWorkMode = !isWorkMode;
        if (isWorkMode) {
            modeBadge.innerHTML = '&#127826; Çalışma Zamanı';
            fsModeBadge.innerHTML = '&#127826; Çalışma Zamanı';
            modeBadge.classList.remove('break-mode');
            fullscreenOverlay.classList.remove('break-bg');
            timerDisplay.style.color = 'var(--cherry-red)';
            startBtn.style.backgroundColor = 'var(--cherry-red)';
        } else {
            modeBadge.innerHTML = '&#127807; Mola Zamanı';
            fsModeBadge.innerHTML = '&#127807; Mola Zamanı';
            modeBadge.classList.add('break-mode');
            fullscreenOverlay.classList.add('break-bg');
            timerDisplay.style.color = 'var(--leaf-green)';
            startBtn.style.backgroundColor = 'var(--leaf-green)';
        }
        resetTimer();
    }

    // --- GÖREV LİSTESİ ---
    let tasks = JSON.parse(localStorage.getItem('cherry_tasks') || '[]');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const taskCount = document.getElementById('taskCount');

    function saveAndRender() {
        localStorage.setItem('cherry_tasks', JSON.stringify(tasks));
        taskList.innerHTML = '';

        tasks.forEach((task, index) => {
            const li = document.createElement('li');
            if (task.completed) li.classList.add('completed');

            const span = document.createElement('span');
            span.className = 'task-text';
            span.textContent = (task.completed ? '[Tamam] ' : '[Kiraz] ') + task.text;
            span.onclick = () => toggleTask(index);

            const delBtn = document.createElement('button');
            delBtn.className = 'btn-delete';
            delBtn.textContent = 'Sil';
            delBtn.onclick = () => deleteTask(index);

            li.appendChild(span);
            li.appendChild(delBtn);
            taskList.appendChild(li);
        });

        const activeTasks = tasks.filter(t => !t.completed).length;
        taskCount.textContent = activeTasks + ' Kalan';
    }

    function addTask() {
        const text = taskInput.value.trim();
        if (text === '') return;
        tasks.push({ text: text, completed: false });
        taskInput.value = '';
        saveAndRender();
    }

    function toggleTask(index) {
        tasks[index].completed = !tasks[index].completed;
        saveAndRender();
    }

    function deleteTask(index) {
        tasks.splice(index, 1);
        saveAndRender();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') addTask();
    }

    updateTimerDisplay();
    saveAndRender();
</script>

</body>
</html>
